[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memorypulse"
version = "0.1.0"
description = "Continuously updated public market intelligence for memory prices"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MemoryPulse contributors"}]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "duckdb>=1.1,<2",
  "feedparser>=6.0,<7",
  "numpy>=1.26,<3",
  "polars>=1.17,<2",
  "pyarrow>=16,<22",
  "PyYAML>=6.0,<7",
  "pytz>=2024.1",
  "requests>=2.32,<3",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
memorypulse = "memorypulse.cli:main"

[tool.setuptools]
package-dir = {"" = "pipeline/src"}

[tool.setuptools.packages.find]
where = ["pipeline/src"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["pipeline/src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["build", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"pipeline/tests/*" = ["S101"]
