sources:
  stanford_memory_prices:
    enabled: true
    url: https://dam.stanford.edu/assets/memory-prices/memory-prices.csv
    frequency: monthly
    reliability: research_dataset
  dramexchange_homepage:
    enabled: false
    url: https://www.dramexchange.com/
    frequency: daily
    reliability: public_homepage
    disabled_reason: Permission required; current Terms of Use restrict reproduction or distribution without prior written consent.
  fred_semiconductor:
    enabled: true
    url_template: https://fred.stlouisfed.org/graph/fredgraph.csv?id={series_id}
    series:
      - id: PCU3344133441
        name: Semiconductor and related device manufacturing producer price index
        unit: index
      - id: CUSR0000SEEE01
        name: U.S. consumer price index for computers, peripherals, and smart home assistants
        unit: index
      - id: IPG3344S
        name: U.S. industrial production for computer and electronic product manufacturing
        unit: index
      - id: PCU33443344
        name: Semiconductor and other electronic component manufacturing producer price index
        unit: index
      - id: IZ3344
        name: U.S. import price index for semiconductor and other electronic component manufacturing
        unit: index
      - id: CAPUTLG3344S
        name: U.S. semiconductor and electronic-component manufacturing capacity utilization
        unit: percent
    frequency: monthly
    reliability: official_statistics
  bls_semiconductor_employment:
    enabled: true
    url: https://api.bls.gov/publicAPI/v1/timeseries/data/CES3133441301
    series_id: CES3133441301
    series_name: U.S. semiconductor and related device manufacturing employment
    unit: thousand employees
    frequency: monthly
    reliability: official_statistics
  world_bank_high_tech_exports:
    enabled: true
    url: https://api.worldbank.org/v2/country/WLD/indicator/TX.VAL.TECH.CD?format=json&per_page=100
    series_id: TX.VAL.TECH.CD
    series_name: Global high-technology exports
    unit: current USD
    frequency: annual
    reliability: official_statistics
  federal_register_semiconductor:
    enabled: true
    url: https://www.federalregister.gov/api/v1/documents.json?per_page=50&order=newest&conditions%5Bterm%5D=semiconductor
    frequency: daily
    reliability: official_policy_metadata
  gdelt_memory_news:
    enabled: true
    url: https://api.gdeltproject.org/api/v2/doc/doc
    frequency: daily
    reliability: aggregated_news_metadata
    max_records: 50
  bestbuy_memory_products:
    enabled: false
    disabled_reason: Public historical archiving is disabled because the API terms limit content caching to 72 hours; written permission would be required.
    requires_env: BESTBUY_API_KEY
    url: https://api.bestbuy.com/v1/products
    frequency: daily
    reliability: optional_retail_api
  keepa_ddr5_panel:
    enabled: true
    requires_env: KEEPA_API_KEY
    url: https://api.keepa.com/product
    source_url: https://keepa.com/#!api
    domain: 1
    price_history_index: 1
    history_days: 2200
    max_products: 50
    frequency: monthly
    reliability: licensed_retail_history
  census_memory_imports:
    enabled: true
    requires_env: CENSUS_API_KEY
    url: https://api.census.gov/data/timeseries/intltrade/imports/hsimport
    source_url: https://api.census.gov/data/timeseries/intltrade/imports/hsimport.html
    direction: imports
    commodity_code: "854232"
    start_month: 2010-01
    frequency: monthly
    reliability: official_statistics
  census_memory_exports:
    enabled: true
    requires_env: CENSUS_API_KEY
    url: https://api.census.gov/data/timeseries/intltrade/exports/hsexport
    source_url: https://api.census.gov/data/timeseries/intltrade/exports/hsexport.html
    direction: exports
    commodity_code: "854232"
    start_month: 2010-01
    frequency: monthly
    reliability: official_statistics
  sec_memory_supplier_fundamentals:
    enabled: true
    requires_env: SEC_CONTACT_EMAIL
    url: https://data.sec.gov/api/xbrl/companyfacts/CIK0000723125.json
    company: Micron Technology
    ticker: MU
    frequency: quarterly
    reliability: official_company_filings
    facts:
      - tag: InventoryNet
        name: inventory
        unit: USD
      - tag: PaymentsToAcquirePropertyPlantAndEquipment
        name: capital expenditure
        unit: USD
      - tag: RevenueFromContractWithCustomerExcludingAssessedTax
        name: revenue
        unit: USD
