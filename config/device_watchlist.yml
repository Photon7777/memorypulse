version: 1.0.0
market: US
free_only: true
cadence:
  official_pages: weekly
  official_newsrooms: daily
  secondary_discovery: daily
  manual_review: weekly
panel_targets:
  minimum_families: 40
  target_configurations: 140
  minimum_primary_source_share: 0.80
  minimum_comparable_transitions_for_modeling: 100
source_policy:
  preferred:
    - manufacturer product pages
    - manufacturer newsrooms
    - regulatory filings and official statistics
  discovery_only:
    - GDELT article metadata
    - reputable technology publications
  prohibited:
    - paid APIs in the default workflow
    - scraped pages whose terms prohibit reuse
    - unreviewed rumors in published metrics
categories:
  smartphones:
    target_configurations: 36
    families:
      Apple: [iPhone, iPhone Plus, iPhone Pro, iPhone Pro Max, iPhone SE]
      Google: [Pixel, Pixel Pro, Pixel Pro XL, Pixel Fold, Pixel A]
      Samsung: [Galaxy S, Galaxy S Plus, Galaxy S Ultra, Galaxy Z Fold, Galaxy Z Flip, Galaxy A]
      OnePlus: [OnePlus flagship, OnePlus R, OnePlus Open, Nord]
      Motorola: [Razr, Razr Plus, Edge, Moto G]
  laptops:
    target_configurations: 42
