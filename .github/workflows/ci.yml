name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "frontend/**"
      - "config/**"
      - "scripts/**"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Python lint and tests
        run: |
          python -m ruff check pipeline
          python -m pytest
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test:run
          npm run build
      - name: Offline end-to-end validation
        run: |
          python -m memorypulse.cli update --offline --output-root build/ci-offline
          python -m memorypulse.cli validate --root build/ci-offline
          python -m memorypulse.cli check-size
