name: Refresh public data

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memorypulse-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pipeline
        run: python -m pip install -e ".[dev]"
      - name: Collect, validate, and export
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          KEEPA_DDR5_ASINS: ${{ secrets.KEEPA_DDR5_ASINS }}
          KEEPA_PUBLIC_EXPORT_ACKNOWLEDGED: ${{ secrets.KEEPA_PUBLIC_EXPORT_ACKNOWLEDGED }}
        run: |
          python -m memorypulse.cli update 2>&1 | tee pipeline.log
          python -m memorypulse.cli validate
          python -m pytest pipeline/tests
          python -m memorypulse.cli check-size
          python -c "import json; from pathlib import Path; m=json.loads(Path('frontend/public/data/manifest.json').read_text()); assert m['production_data'] and not m['fixture_data']"
      - name: Commit validated history and exports
        run: |
          git config user.name "memorypulse-data-bot"
          git config user.email "memorypulse-data-bot@users.noreply.github.com"
          git add data/history data/exports/quality-report.json frontend/public/data frontend/public/datasets/latest
          if git diff --cached --quiet; then
            echo "No validated data changes to commit."
          else
            git commit -m "data: refresh MemoryPulse observations [skip data-update]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Publish monthly public dataset snapshot
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%d)" != "01" ]; then
            echo "Monthly snapshot runs on the first UTC day of each month."
            exit 0
          fi
          month="$(date -u +%Y-%m)"
          tag="dataset-${month}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          bundle="$(jq -r '.bundle.path' frontend/public/datasets/latest/catalog.json)"
          gh release create "$tag" \
            "frontend/public/datasets/latest/${bundle}" \
            frontend/public/datasets/latest/catalog.json \
            frontend/public/datasets/latest/checksums.sha256 \
            --title "MemoryPulse dataset ${month}" \
            --notes "Immutable monthly snapshot of the public MemoryPulse dataset. Review DATA_LICENSE.md and the catalog before reuse."
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: memorypulse-update-diagnostics
          path: |
            pipeline.log
            data/exports/quality-report.json
            frontend/public/datasets/latest/catalog.json
          if-no-files-found: warn
          retention-days: 7
